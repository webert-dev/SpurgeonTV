name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
          
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build project
        run: npm run build:cf

      - name: Prepare Cloudflare Pages structure
        run: |
          echo "=== Root of .open-next ==="
          ls -la .open-next/ 2>/dev/null || echo "ERROR: .open-next NOT FOUND!"
          echo ""
          
          echo "=== Removing cache and internal files that exceed Cloudflare Pages limits ==="
          rm -rf .open-next/cloudflare/cache-assets-manifest.sql
          rm -rf .open-next/dynamodb-provider/
          find .open-next -type f -size +24M -exec rm -f {} \;
          echo "Removed massive cache files to prevent 25 MiB upload limit error."
          echo ""

          echo "=== Moving backend files into assets folder ==="
          # Move worker.js to assets/_worker.js so it acts as Cloudflare Pages Function
          if test -f .open-next/worker.js; then
            mv .open-next/worker.js .open-next/assets/_worker.js
            echo "worker.js MOVED to assets/_worker.js"
          fi
          
          # Move required backend directories into assets so _worker.js can import them
          mv .open-next/cloudflare .open-next/assets/ 2>/dev/null || true
          mv .open-next/server-functions .open-next/assets/ 2>/dev/null || true
          mv .open-next/middleware .open-next/assets/ 2>/dev/null || true
          
          echo "=== New .open-next/assets directory ==="
          ls -la .open-next/assets/ 2>/dev/null | head -30

      - name: Publish to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy .open-next/assets --project-name=spurgeontv --branch=main --commit-dirty=true

