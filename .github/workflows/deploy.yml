name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
          
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build project
        run: npm run build:cf

      - name: Prepare worker for Cloudflare Pages
        run: |
          echo "=== Root of .open-next ==="
          ls -la .open-next/ 2>/dev/null || echo "ERROR: .open-next NOT FOUND!"
          echo ""
          echo "=== Moving worker.js to assets/_worker.js ==="
          if test -f .open-next/worker.js; then
            mv .open-next/worker.js .open-next/assets/_worker.js
            echo "worker.js MOVED to .open-next/assets/_worker.js"
          else
            echo "worker.js NOT FOUND"
          fi
          echo ""
          echo "=== Assets directory ==="
          ls -la .open-next/assets/ 2>/dev/null | head -30

      - name: Publish to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy .open-next/assets --project-name=spurgeontv --branch=main --commit-dirty=true

