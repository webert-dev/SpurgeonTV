name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build project
        run: npm run build:cf

      - name: Diagnose build output
        run: |
          echo "=== Root of .open-next ==="
          ls -la .open-next/ 2>/dev/null || echo "ERROR: .open-next NOT FOUND!"
          echo ""
          echo "=== worker.js check ==="
          if test -f .open-next/worker.js; then
            echo "worker.js FOUND (size: $(wc -c < .open-next/worker.js) bytes)"
          else
            echo "worker.js NOT FOUND"
          fi
          echo ""
          echo "=== Assets directory ==="
          ls -la .open-next/assets/ 2>/dev/null | head -30

      - name: Publish to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy .open-next/assets --project-name=spurgeontv --branch=main --commit-dirty=true

