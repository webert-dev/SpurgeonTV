<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spurgeon TV</title>
  <style>
    body { background-color: #0b0b0f; color: #fff; font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  </style>
  <script>
    (function() {
      try {
        var userLang = navigator.language || navigator.userLanguage;
        var lang = userLang.toLowerCase().substring(0, 2);
        
        if (lang === 'pt') {
          window.location.replace('/pt/');
        } else if (lang === 'es') {
          window.location.replace('/es/');
        } else {
          window.location.replace('/en/');
        }
      } catch (e) {
        window.location.replace('/en/');
      }
    })();
  </script>
</head>
<body>
</body>
</html>
